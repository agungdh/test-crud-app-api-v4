<!-- Component: sidebar. Terima parameter activeMenu biar menu aktif bisa di-highlight.
     Dipakai dari layout: ~{fragments/sidebar :: sidebar(activeMenu=${activeMenu})} -->
<aside th:fragment="sidebar(activeMenu)" class="sidebar">
    <ul>
        <li th:classappend="${activeMenu == 'dashboard'} ? 'active'">
            <a th:href="@{/}">Dashboard</a>
        </li>
        <li th:classappend="${activeMenu == 'persons'} ? 'active'">
            <a th:href="@{/person}">Persons</a>
        </li>
    </ul>
</aside>
