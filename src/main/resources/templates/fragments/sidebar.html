<aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark" th:fragment="sidebar(activeMenu)">
    <!--begin::Sidebar Brand-->
    <div class="sidebar-brand">
        <!--begin::Brand Link-->
        <a th:href="@{/}" class="brand-link">
            <!--begin::Brand Image-->
            <img
                    th:src="@{/assets/img/AdminLTELogo.png}"
                    alt="AdminLTE Logo"
                    class="brand-image opacity-75 shadow"
            />
            <!--end::Brand Image-->
            <!--begin::Brand Text-->
            <span class="brand-text fw-light">Test CRUD App</span>
            <!--end::Brand Text-->
        </a>
        <!--end::Brand Link-->
    </div>
    <!--end::Sidebar Brand-->
    <!--begin::Sidebar Wrapper-->
    <div class="sidebar-wrapper">
        <nav class="mt-2" aria-label="Main navigation">
            <!--begin::Sidebar Menu-->
            <ul
                    class="nav sidebar-menu flex-column"
                    data-lte-toggle="treeview"
                    data-accordion="false"
                    id="navigation"
            >
                <li class="nav-item">
                    <a th:href="@{/}" class="nav-link" th:classappend="${activeMenu == 'dashboard'} ? 'active'">
                        <i class="nav-icon bi bi-speedometer"></i>
                        <p>Dashboard</p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/person}" class="nav-link" th:classappend="${activeMenu == 'persons'} ? 'active'">
                        <i class="nav-icon bi bi-people"></i>
                        <p>Persons</p>
                    </a>
                </li>
            </ul>
            <!--end::Sidebar Menu-->

        </nav>
    </div>
    <!--end::Sidebar Wrapper-->
</aside>
